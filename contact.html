<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Durojaiye Rofiat Titilayo</title>
  <meta name="description" content="Get in touch with Durojaiye Rofiat Titilayo for conversations, connections and collaborations.">
  <meta property="og:title" content="Contact | Durojaiye Rofiat Titilayo"><meta property="og:type" content="website">
  <meta name="theme-color" content="#080D1B">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>document.documentElement.classList.remove("no-js")</script>
</head>
<body data-page="contact">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>
  <main id="main">
    <div class="container page-hero">
      <span class="eyebrow">Contact</span>
      <h1>Let's connect.</h1>
      <p class="lead">I welcome meaningful conversations, professional connections, knowledge-sharing opportunities and collaborations.</p>
    </div>
    <section class="section" style="padding-top:1.5rem">
      <div class="container contact-grid">
        <div>
          <ul class="contact-list" id="contact-list"></ul>
          <div class="btn-row"><a class="btn btn-primary" href="mailto:teetee.duro@gmail.com">Email Me</a><a class="btn btn-ghost" data-link="linkedin" href="#">Connect on LinkedIn</a><a class="btn btn-ghost" data-link="github" href="#">GitHub</a></div>
        </div>
        <div class="card">
          <h2 style="font-size:1.6rem">Send a message</h2>
          <div id="form-note"></div>
          <form id="contact-form" novalidate>
            <div class="field"><label for="name">Name</label><input id="name" name="name" autocomplete="name" aria-describedby="name-err" required><div class="field-error" id="name-err" role="alert"></div></div>
            <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" aria-describedby="email-err" required><div class="field-error" id="email-err" role="alert"></div></div>
            <div class="field"><label for="subject">Subject</label><input id="subject" name="subject" aria-describedby="subject-err" required><div class="field-error" id="subject-err" role="alert"></div></div>
            <div class="field"><label for="message">Message</label><textarea id="message" name="message" rows="6" aria-describedby="message-err" required></textarea><div class="field-error" id="message-err" role="alert"></div></div>
            <div class="hp" aria-hidden="true"><label for="website">Leave this field empty</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
            <button class="btn btn-primary" type="submit">Send message</button>
            <div class="form-status" id="form-status" role="status" aria-live="polite"></div>
          </form>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="data/site-data.js"></script>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
